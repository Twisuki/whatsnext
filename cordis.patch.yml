# whatsnext-dsh bundle patch
#
# DSH 安装方式(官方 CLI):
#
#   dsh plugin --profile web add <本仓库路径>
#
# `dsh plugin add` 会把本包装成 profile 的依赖, 并因本包的 package.json 声明了
# `dsh.bundle.patch` 而把下面这条 insert 追加到 profile 的 bundle 层栈
# (`dsh.profile.bundles`), 等价于手工在 profile 的 cordis.patch.yml 里写同一行.
#
# 插件行 name 必须与 profile 依赖里的包名一致; 本包 package.json 的 "name" 为
# whatsnext-dsh, 因此这里写 whatsnext-dsh.
#
# 注意: 若此前已手工在 profile 的 cordis.patch.yml 挂载过同一 id, 切换安装方式前
# 请先删掉旧行, 避免同一插件被重复挂载、命令重复注册.
- insert:
    - id: whatsnext-commands
      name: whatsnext-dsh
